<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Groupes de discussion</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>C</text></svg>" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0f1115" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="login-overlay" id="login-overlay">
    <div class="login-card">
      <h1>Groupes de discussion</h1>
      <p>Connecte-toi pour créer des groupes et discuter.</p>
      <button class="google-btn" id="login-btn" type="button">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        Se connecter avec Google
      </button>
    </div>
  </div>

  <div class="app">
    <aside class="sidebar" id="sidebar">
      <header class="sidebar__head">
        <h1>Groupes</h1>
        <div class="user" id="user-zone">
          <img class="user__avatar" id="user-avatar" alt="" hidden />
          <span class="user__name" id="user-name"></span>
          <button class="icon-btn" id="install-btn" type="button" hidden aria-label="Installer l'application" title="Installer l'application">
            <i data-lucide="download" aria-hidden="true"></i>
          </button>
          <button class="icon-btn" id="notif-btn" type="button" hidden aria-label="Activer les notifications" title="Activer les notifications">
            <i data-lucide="bell-off" aria-hidden="true"></i>
          </button>
          <button class="logout" id="logout-btn" type="button" hidden>Déconnexion</button>
        </div>
      </header>

      <form class="new-group" id="new-group-form">
        <label class="sr-only" for="new-group-input">Nom du nouveau groupe</label>
        <input
          type="text"
          id="new-group-input"
          name="new-group-input"
          placeholder="Nom du nouveau groupe…"
          autocomplete="off"
          maxlength="40"
        />
        <button type="submit" aria-label="Créer le groupe">
          <i data-lucide="plus" aria-hidden="true"></i>
        </button>
      </form>

      <form class="join-code" id="join-code-form">
        <label class="sr-only" for="join-code-input">Rejoindre avec un code</label>
        <input
          type="text"
          id="join-code-input"
          name="join-code-input"
          placeholder="Rejoindre avec un code…"
          autocomplete="off"
          maxlength="10"
        />
        <button type="submit" aria-label="Rejoindre le groupe">
          <i data-lucide="arrow-right" aria-hidden="true"></i>
        </button>
      </form>

      <ul class="group-list" id="group-list"></ul>
    </aside>

    <main class="chat">
      <header class="chat__head" id="chat-head">
        <button class="icon-btn sidebar-toggle" id="sidebar-toggle" type="button" aria-label="Afficher ou masquer la liste des groupes">
          <i data-lucide="panel-left" aria-hidden="true"></i>
        </button>
        <h2 id="chat-title">Sélectionne un groupe</h2>
        <div class="chat__actions">
          <button class="btn-ghost" id="admin-btn" type="button" hidden aria-label="Membres et paramètres">
            <i data-lucide="users" aria-hidden="true"></i>
            <span>Membres</span>
          </button>
          <button class="btn-danger" id="delete-group" type="button" hidden>Supprimer</button>
        </div>
      </header>

      <div class="pinned-bar" id="pinned-bar" hidden></div>

      <div class="messages" id="messages"></div>

      <div class="typing" id="typing" hidden></div>

      <form class="composer" id="composer" hidden>
        <label class="attach" id="attach-btn" for="image-input" title="Envoyer une image" aria-label="Envoyer une image">
          <i data-lucide="image" aria-hidden="true"></i>
        </label>
        <input type="file" id="image-input" name="image-input" accept="image/*" hidden />
        <button class="attach" id="poll-btn" type="button" title="Créer un sondage" aria-label="Créer un sondage">
          <i data-lucide="bar-chart-3" aria-hidden="true"></i>
        </button>
        <div class="emoji-wrap">
          <button class="attach" id="emoji-btn" type="button" title="Emojis" aria-label="Emojis">
            <i data-lucide="smile" aria-hidden="true"></i>
          </button>
          <div class="emoji-pop" id="emoji-pop" hidden></div>
        </div>
        <button class="attach" id="time-btn" type="button" title="Insérer un horodatage" aria-label="Insérer un horodatage">
          <i data-lucide="clock" aria-hidden="true"></i>
        </button>
        <label class="sr-only" for="message-input">Écris un message</label>
        <input
          type="text"
          id="message-input"
          name="message-input"
          placeholder="Écris un message…"
          autocomplete="off"
        />
        <button type="submit">Envoyer</button>
      </form>
    </main>
  </div>

  <div class="modal-overlay" id="admin-overlay" hidden>
    <div class="modal">
      <header class="modal__head">
        <h3>Paramètres du groupe</h3>
        <button class="modal__close" id="admin-close" type="button" aria-label="Fermer">
          <i data-lucide="x" aria-hidden="true"></i>
        </button>
      </header>

      <div class="settings-block">
        <span class="settings-label">Code d'invitation</span>
        <div class="invite-row">
          <code class="invite-code" id="invite-code">------</code>
          <button type="button" class="btn-ghost" id="copy-invite">Copier</button>
        </div>
        <p class="settings-hint">Partage ce code pour laisser quelqu'un rejoindre le groupe.</p>
      </div>

      <div class="settings-block">
        <span class="settings-label">Membres</span>
        <ul class="member-list" id="member-list"></ul>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="preview-overlay" hidden>
    <div class="modal preview-modal">
      <header class="modal__head">
        <h3>Envoyer l'image</h3>
        <button class="modal__close" id="preview-close" type="button" aria-label="Fermer">
          <i data-lucide="x" aria-hidden="true"></i>
        </button>
      </header>
      <img class="preview-img" id="preview-img" alt="Aperçu" />
      <p class="settings-hint" id="preview-size"></p>
      <div class="preview-actions">
        <button type="button" class="btn-ghost" id="preview-cancel">Annuler</button>
        <button type="button" class="preview-send" id="preview-send">Envoyer</button>
      </div>
    </div>
  </div>

  <div class="lightbox" id="lightbox" hidden>
    <img class="lightbox-img" id="lightbox-img" alt="Image" />
  </div>

  <div class="modal-overlay" id="poll-overlay" hidden>
    <div class="modal">
      <header class="modal__head">
        <h3>Nouveau sondage</h3>
        <button class="modal__close" id="poll-close" type="button" aria-label="Fermer">
          <i data-lucide="x" aria-hidden="true"></i>
        </button>
      </header>
      <form id="poll-form">
        <label class="sr-only" for="poll-question">Question du sondage</label>
        <input class="poll-input" id="poll-question" name="poll-question" type="text" placeholder="Question…" maxlength="120" autocomplete="off" />
        <div class="poll-options" id="poll-options"></div>
        <button class="btn-ghost" id="poll-add-option" type="button">+ Ajouter une option</button>
        <div class="preview-actions">
          <button type="button" class="btn-ghost" id="poll-cancel">Annuler</button>
          <button type="submit" class="preview-send">Créer</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
